<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home">CodeHub</a>

    <nav class="main-nav" aria-label="Main">
      <a href="#home" class="nav-link active" data-target="home">Home</a>
      <a href="#courses" class="nav-link" data-target="courses">Courses</a>
      <a href="#contact" class="nav-link" data-target="contact">Contact</a>
    </nav>

    <label class="theme-toggle" for="dark-toggle">
      <span class="theme-label">Dark mode</span>
      <input type="checkbox" id="dark-toggle" class="theme-input">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </header>

  <main>
    <section id="home" class="page">
      <article class="profile-card">
        <div class="avatar" aria-hidden="true">LG</div>
        <h1 class="name">Lorraine Jade Gulle</h1>
        <p class="course">BS Information Technology, 2nd Year</p>

        <ul class="chips">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>

        <div class="actions">
          <button type="button" id="like-btn" class="btn btn-primary">
            <span aria-hidden="true">&hearts;</span> Like
            <span id="like-count" class="count">24</span>
          </button>
          <button type="button" id="reset-btn" class="btn btn-outline">Reset</button>
        </div>
      </article>
    </section>

    <section id="courses" class="page" hidden>
      <article class="profile-card info-card">
        <h2>Courses</h2>
        <ul class="plain-list">
          <li>Web Design</li>
          <li>Programming</li>
          <li>Networking</li>
          <li>Troubleshooting</li>
        </ul>
      </article>
    </section>

    <section id="contact" class="page" hidden>
      <article class="profile-card info-card">
        <h2>Contact</h2>
        <p>Email: lorraine.gulle@gmail.com</p>
        <p>School: Caraga State University</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CodeHub</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
